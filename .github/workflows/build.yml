name: Build .deb

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y fakeroot dpkg make git curl xz-utils

      - name: Install ldid
        run: |
          sudo curl -fsSL \
            https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64 \
            -o /usr/local/bin/ldid
          sudo chmod +x /usr/local/bin/ldid

      - name: Install Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$THEOS"

      - name: Install iOS 16.5 SDK
        run: |
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git sdks-tmp
          git -C sdks-tmp sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          mv sdks-tmp/iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Build package (rootless)
        env:
          THEOS_PACKAGE_SCHEME: rootless
        run: |
          make package FINALPACKAGE=1

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: Little16-deb
          path: packages/*.deb
          retention-days: 30

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
          generate_release_notes: true
